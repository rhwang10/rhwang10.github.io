<section class="experience" aria-labelledby="experience-title">
  <h2 id="experience-title">Work Experience</h2>
  <ol class="jobs">
    {%- for job in site.data.experience %}
    <li class="job">
      <div class="job__head">
        <h3 class="job__company"><a href="{{ job.url | escape }}">{{ job.company | escape }}</a></h3>
        <p class="job__dates">{{ job.timerange | escape }}</p>
      </div>
      <p class="job__position">{{ job.position | escape }}</p>
      {%- if job.blurb %}
      <p class="job__blurb">{{ job.blurb | escape }}</p>
      {%- endif %}
    </li>
    {%- endfor %}
  </ol>
</section>
