{%- if page.title -%}
  {%- assign page_title = page.title | append: " | " | append: site.title -%}
{%- else -%}
  {%- assign page_title = site.title -%}
{%- endif -%}
{%- assign description = page.description | default: site.description | strip_newlines -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Hello World! Robert Hwang, Software Engineer">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="preload" href="{{ '/assets/fonts/figtree-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<script>
  // Apply the saved (or OS-preferred) theme before first paint so night mode doesn't flash.
  (function (root) {
    var theme;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    root.dataset.theme = theme;
    root.classList.add("js");
  })(document.documentElement);
</script>
