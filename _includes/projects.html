<section class="projects" aria-labelledby="projects-title">
  <h2 id="projects-title">Projects</h2>
  <p class="projects__intro">Some of the work I have done. Every project links to its code on GitHub.</p>
  <ul class="projects__list">
    {%- for project in site.data.projects %}
    <li class="project">
      <h3>{{ project.name | escape }}</h3>
      <p class="project__links">
        <a href="{{ project.github | escape }}">GitHub</a>
        {%- if project.link %}
        <a href="{{ project.link | escape }}">Link to project</a>
        {%- endif %}
      </p>
      <p>{{ project.description | escape }}</p>
    </li>
    {%- endfor %}
  </ul>
</section>
