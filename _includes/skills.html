<section class="skills" aria-labelledby="skills-title">
  <h2 id="skills-title">Skills and Technologies</h2>
  <div class="skills__groups">
    {%- for group in site.data.skills %}
    <div>
      <h3>{{ group.group | escape }}</h3>
      <ul>
        {%- for item in group.items %}
        <li>{{ item | escape }}</li>
        {%- endfor %}
      </ul>
    </div>
    {%- endfor %}
  </div>
</section>
